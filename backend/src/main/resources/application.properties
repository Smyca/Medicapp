
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.native.enabled=true

# Conexi�n a MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=user
quarkus.datasource.password=pass
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/medicapp

# Hibernate ORM actualizado
quarkus.hibernate-orm.schema-generation.database.action=update

# CORS actualizado
quarkus.http.cors.enabled=true
#quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type
quarkus.http.cors.origins=*

%prod.quarkus.datasource.jdbc.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASS}